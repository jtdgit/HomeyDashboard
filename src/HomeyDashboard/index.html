<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homey Dashboard — Huize De Vries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Header -->
  <header class="dashboard-header">
    <div class="header__left">
      <div class="header__logo"></div>
      <div class="header__info">
        <h1 class="header__title">Huize De Vries</h1>
        <span class="header__subtitle">Amsterdam</span>
      </div>
    </div>
    <div class="header__right">
      <div class="header__weather" id="weather-widget">
        <span class="material-symbols-outlined">cloud</span>
        <span class="header__weather-temp">8°C</span>
        <span class="header__weather-cond">Bewolkt</span>
      </div>
      <div class="header__clock" id="clock"></div>
    </div>
  </header>

  <!-- Dashboard Grid -->
  <main class="dashboard-grid">

    <!-- Energieverbruik -->
    <section class="card card--energy" id="energy-card">
      <div class="card__header">
        <span class="material-symbols-outlined card__icon">bolt</span>
        <h2 class="card__title">Energieverbruik</h2>
        <span class="card__badge card__badge--live"><span class="badge__dot"></span> Live</span>
      </div>
      <div class="card__body">
        <div class="energy-stats" id="energy-stats"></div>
        <div class="energy-chart" id="energy-chart"></div>
        <div class="energy-legend">
          <span class="energy-legend__item"><span class="energy-legend__color energy-legend__color--usage"></span> Verbruik</span>
          <span class="energy-legend__item"><span class="energy-legend__color energy-legend__color--solar"></span> Zonne-energie</span>
        </div>
      </div>
    </section>

    <!-- Temperatuur / Klimaat -->
    <section class="card card--climate" id="climate-card">
      <div class="card__header">
        <span class="material-symbols-outlined card__icon">thermostat</span>
        <h2 class="card__title">Klimaat</h2>
        <span class="card__badge"><span class="material-symbols-outlined" style="font-size:14px">local_fire_department</span> Verwarmt</span>
      </div>
      <div class="card__body">
        <div class="climate-gauge" id="climate-gauge"></div>
        <div class="climate-controls" id="climate-controls"></div>
        <div class="climate-stats" id="climate-stats"></div>
      </div>
    </section>

    <!-- Alarm / Beveiliging -->
    <section class="card card--alarm" id="alarm-card">
      <div class="card__header">
        <span class="material-symbols-outlined card__icon">shield</span>
        <h2 class="card__title">Beveiliging</h2>
      </div>
      <div class="card__body">
        <div class="alarm-modes" id="alarm-modes"></div>
        <div class="alarm-zones" id="alarm-zones"></div>
        <div class="alarm-history" id="alarm-history"></div>
      </div>
    </section>

    <!-- Apparaten -->
    <section class="card card--devices" id="devices-card">
      <div class="card__header">
        <span class="material-symbols-outlined card__icon">devices</span>
        <h2 class="card__title">Apparaten</h2>
        <span class="card__badge" id="devices-count"></span>
      </div>
      <div class="card__body">
        <div class="devices-grid" id="devices-grid"></div>
      </div>
    </section>

    <!-- Flows -->
    <section class="card card--flows" id="flows-card">
      <div class="card__header">
        <span class="material-symbols-outlined card__icon">account_tree</span>
        <h2 class="card__title">Flows</h2>
      </div>
      <div class="card__body">
        <div class="flows-list" id="flows-list"></div>
      </div>
    </section>

    <!-- Notificaties -->
    <section class="card card--notifications" id="notifications-card">
      <div class="card__header">
        <span class="material-symbols-outlined card__icon">notifications</span>
        <h2 class="card__title">Meldingen</h2>
        <span class="card__badge card__badge--count" id="notif-count"></span>
      </div>
      <div class="card__body">
        <div class="notif-list" id="notif-list"></div>
      </div>
    </section>

  </main>

  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
